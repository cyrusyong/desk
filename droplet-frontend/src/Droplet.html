<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Droplet — drop a file</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ece1c4;
        --paper-dot: #cbb98d;
        --ink: #4a2a18;
        --ink-soft: #7a4a32;
        --wood-1: #c98a55;
        --wood-2: #a86736;
        --wood-3: #804e25;
        --wood-4: #5a3517;
        --wood-hl: #e6b07b;
        --shadow: #2a160a;
        --accent: #c8423a;
        --accent-deep: #8a2722;
        --paper-file: #f6efd8;
        --paper-file-line: #c8b88a;
        --metal: #e7c878;
        --metal-deep: #8a6a1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "VT323", monospace;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: unset;
      }

      /* Dotted "napkin" paper bg, but pixel-grid style */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
          var(--paper-dot) 1.5px,
          transparent 1.5px
        );
        background-size: 24px 24px;
        background-position: 0 0;
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }

      #root {
        position: relative;
        z-index: 1;
        height: 100%;
      }

      /* All pixel rendering uses absolutely-positioned blocks inside a scaled wrapper */
      .pixel-stage {
        image-rendering: pixelated;
      }
      .pixel-stage * {
        image-rendering: pixelated;
      }

      /* a single "pixel" cell — sized via CSS var --p */
      .px {
        position: absolute;
        width: var(--p, 6px);
        height: var(--p, 6px);
      }

      /* tweak panel font override */
      .tweaks-panel,
      .tweaks-panel * {
        font-family: "VT323", monospace !important;
      }

      .label {
        font-family: "Press Start 2P", monospace;
      }

      /* glow when dragging */
      @keyframes pulse-glow {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.85;
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-3px, 1px);
        }
        40% {
          transform: translate(3px, -1px);
        }
        60% {
          transform: translate(-2px, 2px);
        }
        80% {
          transform: translate(2px, 0);
        }
      }
      .shaking {
        animation: shake 0.32s steps(4);
      }

      /* Drag overlay — full-screen */
      .drag-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }
      .drag-overlay.hot {
        pointer-events: auto;
      }

      /* file ghost following cursor */
      .file-ghost {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        transition: transform 0.06s linear;
      }

      /* toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--paper);
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        letter-spacing: 0.5px;
        padding: 10px 14px;
        border: 3px solid var(--ink);
        box-shadow:
          4px 4px 0 0 var(--shadow),
          inset 0 0 0 2px var(--paper);
        z-index: 50;
        opacity: 0;
        transition:
          opacity 0.18s,
          transform 0.18s;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-4px);
      }

      /* hint badge */
      .hint {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 5;
        font-family: "Press Start 2P", monospace;
        font-size: 11px;
        color: var(--ink);
        letter-spacing: 1px;
      }
      .hint .sub {
        display: block;
        margin-top: 8px;
        font-family: "VT323", monospace;
        font-size: 18px;
        letter-spacing: 0;
        color: var(--ink-soft);
      }

      /* file count tag in corner */
      .ledger {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 5;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        color: var(--ink);
        text-align: right;
      }
      .ledger .num {
        display: block;
        font-size: 28px;
        margin-top: 8px;
        color: var(--accent-deep);
      }

      .scene {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* small floating particles when drawer open */
      @keyframes drift {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translateY(-40px) translateX(8px);
          opacity: 0;
        }
      }
      .mote {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--wood-hl);
        animation: drift 1.6s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="dresser.jsx"></script>
    <script type="text/babel" src="inside.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
