name: Deploy Lambda Functions

on:
  push:
    branches: ["main"]
    paths:
      - "getS3url/**"
      - "store-data/**"
      - "get-data/**"
      - "list-data/**"
      - "deleteS3Object/**"
      - "delete-data/**"

jobs:
  deploy-getS3url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./getS3url
        run: npm install

      - name: Zip Lambda
        working-directory: ./getS3url
        run: zip -r ../getS3url.zip .

      - name: Deploy Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-2
          function_name: getS3url
          zip_file: getS3url.zip

  deploy-store-data:
    runs-on: ubuntu-latest
