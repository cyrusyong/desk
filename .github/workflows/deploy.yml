          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-2
          function_name: get-data
          zip_file: get-data.zip

  deploy-list-data:
    runs-on: ubuntu-latest
    steps:
