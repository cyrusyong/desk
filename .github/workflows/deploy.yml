name: Deploy Lambda Functions

on:
  push:
    branches: ["main"]

jobs:
  deploy-getS3url:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip]') == false
    steps:
      - uses: actions/checkout@v3
    # Trigger only when getS3url folder changed
    paths:
      - "getS3url/**"

      - name: Install dependencies
        working-directory: ./getS3url
        run: npm install

      - name: Zip Lambda
        working-directory: ./getS3url
        run: zip -r ../getS3url.zip .

      - name: Deploy Lambda
        uses: appleboy/lambda-action@v0.1.9
        with:
          aws_access_key_id: ${{ secrets.AWS_KEY }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET }}
          function_name: getS3url
          zip_file: getS3url.zip

  deploy-store-data:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip]') == false
    paths:
      - "store-data/**"
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        working-directory: ./store-data
        run: npm install

      - name: Zip Lambda
        working-directory: ./store-data
        run: zip -r ../store-data.zip .

      - name: Deploy Lambda
        uses: appleboy/lambda-action@v0.1.9
        with:
          aws_access_key_id: ${{ secrets.AWS_KEY }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET }}
          function_name: store-data
          zip_file: store-data.zip
